services:
  - type: web
    name: fitness-plan
    runtime: node
    rootDir: cloud
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: APP_SECRET
        sync: false
      - key: GT_TOKEN
        sync: false
      - key: GT_REPO
        sync: false
      - key: GT_PATH
        value: state.json
      - key: GT_BRANCH
        value: master
